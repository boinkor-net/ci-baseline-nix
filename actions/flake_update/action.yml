name: "boinkor.net CI/nix flake update"
description: "Updates flake inputs in the current working directory."
author: "Andreas Fuchs <asf@boinkor.net>"
inputs:
  root:
    description: "Directory that the nix flake resides in."
    default: "."
  app_id:
    description: "Github App ID that is used to issue the PR-creation token"
    required: true
  app_installation_id:
    description: "Github App installation ID that is used to issue the PR-creation token"
    required: true
  app_private_key:
    description: "Github App private key that is used to issue the PR-creation token. Should be a secret."
    required: true
  skip_nix_setup:
    description: "Whether to set up nix in this action. Defaults to false. Should be true if you use the setup action in this repo."
    default: false
  auto_merge:
    description: "Whether to automatically merge the created pull request."
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: samueldr/lix-gha-installer-action@latest
      if: "${{ inputs.skip_nix_setup != 'true' }}"
    - uses: fregante/setup-git-user@v2
    - run: nix flake update --commit-lock-file
      shell: bash
      working-directory: ${{inputs.root}}

    - name: Generate token
      id: generate_token
      uses: tibdex/github-app-token@v2
      with:
        app_id: ${{ inputs.app_id }}
        installation_id: ${{ inputs.app_installation_id }}
        permissions: >-
          {"contents": "write", "pull_requests": "write"}
        private_key: ${{ inputs.app_private_key }}

    - name: Create Pull Request
      id: create_pull_request
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{steps.generate_token.outputs.token}}
        commit-message: "Update flake.lock"
        assignees: antifuchs
        delete-branch: true
        branch: flake-update
        base: main
        title: "Update flake.lock"

    - name: Set PR to auto-merge
      if: ${{ inputs.auto_merge == 'true' && contains(fromJson('["created", "updated"]'), steps.create_pull_request.outputs.pull-request-operation) }}
      shell: bash
      run: |
        gh pr merge --auto --merge "$PR_URL"
      env:
        GH_TOKEN: ${{steps.generate_token.outputs.token}}
        PR_URL: ${{steps.create_pull_request.outputs.pull-request-url}}
